<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Area nama, dipakai untuk sapuan cahaya -->
    <clipPath id="nameClip">
      <text x="500" y="112" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="58" font-weight="700">Khalilurrahman Mahdi</text>
    </clipPath>

    <!-- Area reveal nama dari kiri ke kanan -->
    <clipPath id="nameReveal">
      <rect x="100" y="0" width="0" height="240">
        <animate attributeName="width" from="0" to="800" begin="0.3s" dur="1.4s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- Reveal subtitle seperti mengetik -->
    <clipPath id="subReveal">
      <rect x="200" y="0" width="0" height="240">
        <animate attributeName="width" from="0" to="600" begin="2s" dur="1.8s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- Animasi bingkai yang tergambar -->
    <mask id="frameMask">
      <rect width="1000" height="240" fill="black"/>
    </mask>
  </defs>

  <!-- Latar -->
  <rect width="1000" height="240" rx="18" fill="#020617"/>

  <!-- Bingkai menggambar diri -->
  <rect x="8" y="8" width="984" height="224" rx="14" fill="none" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="2500" stroke-dashoffset="2500">
    <animate attributeName="stroke-dashoffset" from="2500" to="0" dur="2.5s" fill="freeze"/>
  </rect>

  <!-- Tag kecil di pojok -->
  <text x="36" y="44" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#3B82F6" opacity="0">
    &lt;dev /&gt;
    <animate attributeName="opacity" from="0" to="0.8" begin="0.1s" dur="0.6s" fill="freeze"/>
  </text>

  <!-- Partikel naik -->
  <circle cx="120" cy="240" r="1.8" fill="#BAE6FD">
    <animate attributeName="cy" values="240;-10" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="240" r="1.2" fill="#C4B5FD">
    <animate attributeName="cy" values="240;-10" dur="8s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="240" r="1.5" fill="#7DD3FC">
    <animate attributeName="cy" values="240;-10"
