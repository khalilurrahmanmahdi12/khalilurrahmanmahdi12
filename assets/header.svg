<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#A78BFA;#22D3EE;#60A5FA" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#22D3EE;#A78BFA;#2563EB" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1000" height="240" rx="18" fill="#020617"/>

  <!-- Bintang berkedip -->
  <circle cx="90" cy="50" r="2" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="220" cy="190" r="1.5" fill="#93C5FD"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="40" r="2" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="170" r="1.5" fill="#C4B5FD"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="205" r="2" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="35" r="1.5" fill="#93C5FD"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>

  <!-- Nama muncul dengan efek scale dan fade -->
  <text x="500" y="115" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="60" font-weight="700" fill="url(#g)" opacity="0">
    Khalilurrahman Mahdi
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Garis bawah melebar dari tengah -->
  <rect x="300" y="132" width="0" height="3" rx="2" fill="url(#g)">
    <animate attributeName="x" from="500" to="300" begin="1.2s" dur="0.8s" fill="freeze"/>
    <animate attributeName="width" from="0" to="400" begin="1.2s" dur="0.8s" fill="freeze"/>
  </rect>

  <!-- Subtitle fade in -->
  <text x="500" y="182" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="22" fill="#94A3B8" opacity="0">
    Full-Stack Web Developer · AI Enthusiast
    <animate attributeName="opacity" from="0" to="1" begin="2s" dur="1s" fill="freeze"/>
  </text>
</svg>
