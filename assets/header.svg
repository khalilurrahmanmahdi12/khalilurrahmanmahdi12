<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111B30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- Elemen geometris halus di kanan -->
    <g fill="none" stroke="#3B82F6" stroke-opacity="0.12" stroke-width="1.5">
      <circle cx="900" cy="130" r="90"/>
      <circle cx="900" cy="130" r="140"/>
      <circle cx="900" cy="130" r="190"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
      <path d="M640 260L900 0M690 260L950 0M740 260L1000 0M790 260L1050 0"/>
    </g>

    <!-- Garis aksen -->
    <rect x="80" y="64" width="0" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" from="0" to="56" begin="0.2s" dur="0.7s" fill="freeze"/>
    </rect>

    <!-- Nama -->
    <text x="80" y="132" textLength="720" lengthAdjust="spacing" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" fill="#F8FAFC" opacity="0">
      KHALILURRAHMAN MAHDI
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.4s" dur="0.9s" fill="freeze"/>
    </text>

    <!-- Pemisah -->
    <rect x="80" y="156" width="0" height="1.5" fill="url(#fade)">
      <animate attributeName="width" from="0" to="840" begin="0.9s" dur="1s" fill="freeze"/>
    </rect>

    <!-- Subtitle -->
    <text x="80" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="1.5" fill="#94A3B8" opacity="0">
      FULL-STACK WEB DEVELOPER
      <tspan fill="#3B82F6" dx="10">|</tspan>
      <tspan dx="10">AI ENTHUSIAST</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.9s" fill="freeze"/>
    </text>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="258.5" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
